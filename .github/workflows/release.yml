name: Publish public UI package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Publish using GitHub OIDC only
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-oidc-only.npmrc"
          echo 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          npm publish --workspace vespoli-ui --access public --provenance

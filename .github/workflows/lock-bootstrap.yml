name: Lockfile generation (temporary)
on:
  pull_request:
    paths: ['package.json', '.github/workflows/lock-bootstrap.yml']
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit auditable lockfile delta
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const entries=Object.fromEntries(Object.entries(after.packages).filter(([key,val])=>JSON.stringify(before.packages[key])!==JSON.stringify(val)));
          const removed=Object.keys(before.packages).filter(k=>!(k in after.packages));
          console.log('LOCK_DELTA_BEGIN'+JSON.stringify({entries,removed})+'LOCK_DELTA_END');
          NODE
